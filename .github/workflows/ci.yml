name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  KUJO_VERSION: v1.2.0

jobs:
  contract-tests:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Install pinned Kujo runtime
        uses: kujolang/kujo/.github/actions/setup-kujo@ed51720892d8e475980909dffe54c8fba8731e11
        with:
          version: v1.2.0

      - name: Verify runtime
        run: kujo --version

      - name: Verify release version sync
        run: bash .github/scripts/check-version-sync.sh

      - name: Check Kujo sources
        shell: bash
        run: |
          set -euo pipefail
          for file in patchbrief.kujo src/*.kujo tests/*.kujo; do
            kujo check "${file}"
          done

      - name: Run contract tests
        run: kujo test
