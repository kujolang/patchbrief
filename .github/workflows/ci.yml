name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  KUJO_VERSION: v1.2.2

jobs:
  contract-tests:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Install pinned Kujo runtime
        uses: kujolang/kujo/.github/actions/setup-kujo@22582e7f0111a1005002579b44f5d03cd2ed1c9c
        with:
          version: v1.2.2

      - name: Verify runtime
        run: kujo --version

      - name: Verify release version sync
        run: bash .github/scripts/check-version-sync.sh

      - name: Check Kujo sources
        shell: bash
        run: |
          set -euo pipefail
          for file in patchbrief.kujo src/*.kujo tests/*.kujo; do
            kujo check "${file}"
          done

      - name: Run contract tests
        run: kujo test

  portable-git:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install published native runtime
        id: runtime
        uses: kujolang/kujo/.github/actions/setup-kujo@9fbad956eecd37448d6dc2f3568105cd1da7b0b0
        with:
          version: v1.6.0
      - name: Real Git contracts without shell authority in both execution modes
        run: node tests/git-portability.mjs
        env:
          KUJO_BIN: ${{ steps.runtime.outputs.kujo-path }}
